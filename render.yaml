# Render Blueprint — деплой бэкенда My Best Hotel
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mybesthotel-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

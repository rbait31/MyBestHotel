<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <title>Требования к гостинице — My Best Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<body x-data="requirementsApp()" x-init="init()">
    <header class="header">
        <h1>My Best Hotel</h1>
        <p class="tagline">Требования к гостинице</p>
    </header>

    <main class="main">
        <section class="card card-requirements">
            <h2 class="card-title-center">Требования к гостинице</h2>
            <div class="form">
                <p class="form-hint form-hint-sub form-label-bold">Тип поездки</p>
                <div class="form-row form-row-wrap">
                    <label><input type="checkbox" :checked="profile.trip_type === 'leisure'" @change="profile.trip_type = $event.target.checked ? 'leisure' : 'business'" /> Отдых</label>
                    <label><input type="checkbox" :checked="profile.trip_type === 'business'" @change="profile.trip_type = $event.target.checked ? 'business' : 'leisure'" /> Бизнес</label>
                </div>
                <div class="form-row">
                    <label for="profile-budget-min">Цена мин (€/ночь) <input id="profile-budget-min" name="budget_min" type="number" min="0" step="10" autocomplete="off" x-model.number="profile.budget_min" placeholder="—" /></label>
                    <label for="profile-budget-max">Цена макс (€/ночь) <input id="profile-budget-max" name="budget_max" type="number" min="0" step="10" autocomplete="off" x-model.number="profile.budget_max" placeholder="—" /></label>
                </div>
                <div class="form-row">
                    <label><input id="profile-with-car" name="with_car" type="checkbox" autocomplete="off" x-model="profile.with_car" /> С машиной</label>
                    <label><input id="profile-with-pets" name="with_pets" type="checkbox" autocomplete="off" x-model="profile.with_pets" /> С питомцами</label>
                </div>

                <h3 class="requirements-section form-hint-sub form-label-bold">Предпочтения</h3>

                <p class="form-hint form-hint-sub">1.1 Важность (0–5)</p>
                <div class="slider-grid">
                    <label class="slider-label"><span>Близость к центру города</span><input type="range" min="0" max="5" step="1" x-model.number="profile.preference_center" class="slider" /><span x-text="profile.preference_center ?? 3"></span></label>
                    <label class="slider-label"><span>Чистота</span><input type="range" min="0" max="5" step="1" x-model.number="profile.preference_cleanliness" class="slider" /><span x-text="profile.preference_cleanliness ?? 3"></span></label>
                    <label class="slider-label"><span>Тишина</span><input type="range" min="0" max="5" step="1" x-model.number="profile.preference_quiet" class="slider" /><span x-text="profile.preference_quiet ?? 3"></span></label>
                    <label class="slider-label"><span>Wi-Fi</span><input type="range" min="0" max="5" step="1" x-model.number="profile.preference_wifi" class="slider" /><span x-text="profile.preference_wifi ?? 3"></span></label>
                    <label class="slider-label"><span>Близость к природе/паркам</span><input type="range" min="0" max="5" step="1" x-model.number="profile.preference_nature" class="slider" /><span x-text="profile.preference_nature ?? 3"></span></label>
                </div>
                <div class="form-row">
                    <input type="text" class="input-stub" placeholder="Введи свое" disabled title="Будет в следующей версии" />
                </div>

                <p class="form-hint form-hint-sub">Дополнительные данные</p>
                <div class="form-row form-row-wrap">
                    <label><input type="checkbox" x-model="profile.breakfast_included" /> Завтрак включён</label>
                    <label><input type="checkbox" x-model="profile.with_car" /> С автомашиной</label>
                    <label><input type="checkbox" x-model="profile.solo" /> Соло</label>
                    <label><input type="checkbox" x-model="profile.couple" /> Пара</label>
                    <label><input type="checkbox" x-model="profile.family" /> Семья</label>
                    <label><input type="checkbox" x-model="profile.group" /> Группа</label>
                    <label><input type="checkbox" x-model="profile.with_pets" /> С животными</label>
                </div>
                <div class="form-row">
                    <input type="text" class="input-stub" placeholder="Введи свое" disabled title="Будет в следующей версии" />
                </div>

                <p class="form-hint form-hint-sub form-label-bold form-label-red">Критично (Red Flags)</p>
                <div class="form-row form-row-wrap">
                    <label><input type="checkbox" x-model="profile.red_flag_safety" /> Плохая безопасность</label>
                    <label><input type="checkbox" x-model="profile.red_flag_dirt" /> Грязь</label>
                    <label><input type="checkbox" x-model="profile.red_flag_noise_night" /> Шум ночью</label>
                    <label><input type="checkbox" x-model="profile.red_flag_weak_wifi" /> Слабый Wi-Fi</label>
                    <label><input type="checkbox" x-model="profile.red_flag_no_car_access" /> Сложный доступ без машины</label>
                    <label><input type="checkbox" x-model="profile.red_flag_insects" /> Насекомые в номере</label>
                    <label><input type="checkbox" x-model="profile.red_flag_scam" /> Обман/скрытые платежи</label>
                </div>
                <div class="form-row">
                    <input type="text" class="input-stub" placeholder="Введи свое" disabled title="Будет в следующей версии" />
                </div>

                <p class="form-hint">Темы: cleanliness, location, noise, internet, staff, parking, safety — сохраняются в профиле.</p>
                <div class="profile-actions">
                    <button type="button" class="btn btn-primary" @click="saveProfile()">Сохранить</button>
                    <div class="profile-actions-center">
                        <button type="button" class="btn btn-secondary btn-json" title="Для тестовых целей" @click="exportProfile()">Экспорт JSON</button>
                        <label class="btn btn-secondary btn-json" title="Для тестовых целей">Импорт JSON <input id="profile-import" name="profile_import" type="file" accept=".json" autocomplete="off" @change="importProfile($event)" hidden /></label>
                    </div>
                    <a href="index.html" class="btn btn-secondary profile-back">← Поиск</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
    <script>
      function requirementsApp() {
        return {
          profile: defaultProfile(),
          async init() {
            const loaded = await loadProfile();
            this.profile = { ...defaultProfile(), ...loaded };
          },
          async saveProfile() {
            const ok = await saveProfile(this.profile);
            alert(ok ? "Требования сохранены на сервере." : "Сохранено локально (сервер недоступен).");
          },
          exportProfile() {
            const json = exportProfileJSON(this.profile);
            const blob = new Blob([json], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "mybesthotel-profile.json";
            a.click();
            URL.revokeObjectURL(a.href);
          },
          async importProfile(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async () => {
              const next = await importProfileJSON(reader.result);
              if (next) {
                this.profile = next;
                alert("Требования загружены и сохранены.");
              } else {
                alert("Неверный JSON.");
              }
            };
            reader.readAsText(file);
            event.target.value = "";
          },
        };
      }
    </script>
</body>
</html>
